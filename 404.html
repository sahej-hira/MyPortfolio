<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>404 - Page Not Found | Sahej Hira Portfolio</title>
    <meta name="description" content="The page you're looking for doesn't exist. Visit Sahej Hira's portfolio homepage to explore projects, experience, and creative work." />
    <meta name="robots" content="noindex, nofollow" />
    <style>
      body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        color: white;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        text-align: center;
      }
      .container {
        max-width: 600px;
        padding: 40px 20px;
      }
      h1 {
        font-size: 4rem;
        margin-bottom: 20px;
        opacity: 0.9;
      }
      h2 {
        font-size: 1.5rem;
        margin-bottom: 30px;
        opacity: 0.8;
      }
      p {
        font-size: 1.1rem;
        margin-bottom: 30px;
        line-height: 1.6;
        opacity: 0.7;
      }
      .btn {
        display: inline-block;
        background: #4CAF50;
        color: white;
        padding: 12px 24px;
        text-decoration: none;
        border-radius: 6px;
        font-weight: bold;
        transition: background 0.3s ease;
      }
      .btn:hover {
        background: #45a049;
      }
    </style>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafrex/spa-github-pages
      var segmentCount = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <div class="container">
      <h1>404</h1>
      <h2>Page Not Found</h2>
      <p>The page you're looking for doesn't exist or has been moved.</p>
      <p>You'll be redirected to the homepage shortly, or click below to go there now.</p>
      <a href="/MyPortfolio" class="btn">Go to Homepage</a>
    </div>
  </body>
</html>
